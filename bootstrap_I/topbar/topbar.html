<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/topbar.css">

  <title>Topbar</title>
</head>

<body>
  <!-- Topbar -->
  <div class="container-fluid topbar">
    <div class="row d-flex align-items-center h-100">
      
      <!-- Logo -->
      <div class="col-3">
        <a href="" class="logo text-white">
          <span class="visually-hidden">Inicio -</span>
          Sicid <small>intranet</small>
        </a>
      </div>
      
      <!-- User/Rol -->
      <div class="col-6">
        <p class="mb-0">
          <strong>PONADIS -</strong>
          <span class="visually-hidden">Rol:</span> Administrador
        </p>
      </div>
      
      <!-- Opciones de config -->
      <div class="col-3">
        <div class="row d-flex align-items-center justify-content-around"> <!-- - A + -->
          <div class="col-3 d-flex align-items-center justify-content-end">
            <button class="btn"><i class="fa-solid fa-minus border p-2 me-2"></i></button>
            <button class="btn"><i class="fa-solid fa-a border p-2 me-2"></i></button>
            <button class="btn"><i class="fa-solid fa-plus border p-2 me-2"></i></button>
          </div>
          
          <!-- Contraste -->
          <div class="col-1">
            <button class="btn"><i class="fa-solid fa-circle-half-stroke border p-2 me-2"></i></button>
          </div>
          
          <!-- Notificaciones -->
          <div class="col-1">
            <button class="btn"><i class="fa-solid fa-bell border p-2 me-2"></i></button>
          </div>
          
          <!-- Usuario -->
          <div class="col-1">
            <span class="border rounded-circle px-2">MC</span>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>
</body>
</html>
