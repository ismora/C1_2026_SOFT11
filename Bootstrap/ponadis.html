<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/ponadis.css">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Document</title>
</head>
<body>
    <!-- Topbar -->
    <div class="container-fluid topbar">
        <div class="row d-flex align-items-center h-100">
            <div class="col-3"> <!-- Logo -->
                <a href="" class="logo text-white text-decoration-none">
                    <span class="visually-hidden"> Inicio </span>
                    Sicid <small>intranet</small>
                </a>
            </div>

            <div class="col-6"> <!-- Usuario / rol -->
                <p class="mb-0">
                    <strong>Ponadis - </strong>
                    <span class="visually-hidden">Rol:</span>Administrador
                </p>
            </div>

            <div class="col-3"> <!-- Otras opciones de configuracion -->
                <div class="row d-flex align-items-center justify-content-around">
                    <div class="col-3 d-flex align-items-center justify-content-end"> <!-- - A + -->
                        <button class="btn">
                            <i class="fa-solid fa-minus border p-2 me-2"></i>
                        </button>

                        <button class="btn">
                            <i class="fa-solid fa-a border p-2 me-2"></i>
                        </button>

                        <button class="btn">
                            <i class="fa-solid fa-plus border p-2 me-2"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Contraste-->
                        <button class="btn">
                            <i class="fa-solid fa-circle-half-stroke border p-2 me-2"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Notificaciones -->
                        <button class="btn">
                            <i class="fa-solid fa-bell border p-2 me-2"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Usuario -->
                        <span class="border rounded-circle p-2 me-2">MC</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
