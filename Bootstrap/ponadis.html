<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponadis (ejemplo de uso de Bootstrap)</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/ponadis.css">

</head>

<body>

    <!-- Topbar-->
    <div class="container-fluid topbar">
        <div class="row d-flex align-items-center h-100">

            <div class="col-3"> <!-- Logo -->
                <a href="">
                    <span class="visually-hidden">Inicio -</span>
                    Sicid <small>intranet</small>
                </a>
            </div>

            <div class="col-6"> <!-- Usuario / rol-->
                <p class="mb-0">
                    <strong>PONADIS - </strong>
                    <span class="visually-hidden">Rol:</span>Administrador
                </p>

            </div>

            <div class="col-3"> <!-- Otras opciones de configuración -->
                <div class="row d-flex align-items-center justify-content-around">
                    <div class="col-3 d-flex align-items-center justify-content-end"> <!-- - A + -->
                        <button class="btn">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <button class="btn">
                            <i class="fa-solid fa-a"></i>
                        </button>
                        <button class="btn">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                    </div>

                    <div class="col-1"> <!--Contraste-->
                        <button class="btn">
                            <i class="fa-solid fa-circle-half-stroke"></i>
                        </button>

                    </div>

                    <div class="col-1"> <!--Notificaciones-->
                        <button class="btn">
                            <i class="fa-solid fa-bell"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!--Usuario-->
                        <span>MC</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
