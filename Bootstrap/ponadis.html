<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/ponadis.css">

    <title>Ponadis (ejemplo de uso de Bootstrap)</title>

</head>

<body>

    <!-- Topbar -->
    <div class="container-fluid topbar">
        <div class="row d-flex align-items-center h-100">

            <div class="col-3"> <!-- Logo -->
                <a href="" class="logo text-white text-decoration-none">
                    <span class="visually-hidden">Inicio -</span>
                    Sicid <small>intranet</small>
                </a>
            </div>

            <div class="col-6"> <!-- Usuario / rol -->
                <p class="mb-0">
                    <strong>PONADIS - </strong>
                    <span class="visually-hidden">Rol:</span>Administrador
                </p>
            </div>

            <div class="col-3"> <!-- Otras opciones de configuracion -->
                <div class="row d-flex align-items-center justify-content-around">
                    <div class="col-3 d-flex align-items-center justify-content-end"> <!-- - A + -->
                        <button class="btn">
                            <i class="fa-solid fa-minus border p-2 me-2"></i>
                        </button>

                        <button class="btn">
                            <i class="fa-solid fa-a border p-2 me-2"></i>
                        </button>

                        <button class="btn">
                            <i class="fa-solid fa-plus border p-2 me-2"></i>
                        </button>

                    </div>

                    <div class="col-1"> <!-- Contraste -->
                        <button class="btn">
                            <i class="fa-solid fa-circle-half-stroke p-2 me-2"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Notificaciones -->
                        <button class="btn">
                            <i class="fa-solid fa-bell p-2 me-2"></i>
                        </button>
                    </div>

                    <div class="col-1"> <!-- Usuario -->
                        <span class="border rounded-circle px-2 py-2">MC</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!--Layout principal-->
    <main class="container-fluid">
        <div class="row">

            <!-- Barra lateral -->
            <div class="col-3 sidebar p-0">

                <div class="role-box d-flex justify-content-between align-items-center p-3">
                    <span>Gestor: <strong>PONADIS</strong></span>

                    <button aria-label="Actualizar periodos" class="btn btn-link p-0">
                        <i class="fas fa-sync-alt text-white" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="p-3">
                    <button class="btn btn-nueva-politica w-100 mb-4">
                        <i class="fa-solid fa-circle-plus me-2" aria-hidden="true"></i> Nueva política
                    </button>

                    <h2 class="h6 text-muted">Periodos</h2>

                    <ul class="list-unstyled list-politicas">
                        <li>
                            <a href="" class="text-decoration-none">
                                PONADIS Periodo
                                <span class="d-block small">2020 - 2030</span>
                            </a>
                        </li>

                        <li>
                            <a href="" class="text-decoration-none mb-3">
                                PONADIS Periodo
                                <span class="d-block small">2011 - 2021</span>
                            </a>
                        </li>

                        <li>
                            <a href="" class="text-decoration-none mb-3">
                                PONADIS Periodo
                                <span class="d-block small">2010 - 2005</span>
                            </a>
                        </li>

                        <li>
                            <a href="" class="text-decoration-none mb-3">
                                PONADIS Periodo
                                <span class="d-block small">2004 - 2000</span>
                            </a>
                        </li>

                    </ul>
                    <button class="btn btn-ver-politicas w-50">
                        Ver todos
                    </button>
                </div>
            </div>

            <!--Contenido principal-->
            <div class="col-9">

                <!-- NAVBAR-->
                <div class="row g-0">
                    <div class="col-12 d-flex justify-content-around">
                        <ul class="nav nav-tabs">
                            <li class="nav-item">
                                <a class="nav-link active" href="">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="">General</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="">Formulacion</a>
                            </li>

                        </ul>

                    </div>


                </div>

                <!-- CONTENT BODY (cuerpo del contenido o parte interna donde va la información específica), no es una etiqueta HTML oficial, es solo un nombre para estructurar la información -->
                <div>
                    <!-- FILA IMAGEN -->
                    <div class="row">
                        <p>Figura</p>
                    </div>

                </div>

                <!-- FILA TÍTULO -->
                <div class="row">
                    <p>Título</p>

                </div>

                <!-- FILA TARJETAS -->
                <div class="row d-flex justify-content-evenly g-5 m-4">
                    <p>Tarjetas</p>
                </div>
            </div>

        </div>

        </div>

        </div>


    </main>


</body>

</html>
