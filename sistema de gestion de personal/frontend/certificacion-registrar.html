<html lang="es">
<body>

    <h1>Agregar nueva certificación</h1>
    <form>
        <div>
            <label for="txtNombre">Nombre:</label>
            <input type="text" id="txtNombre" required>
        </div>

        <div>
            <label for="txtInstitución">Institución:</label>
            <input type="text" id="txtInstitución" required>
        </div>

        <div>
            <label for="txtDescripcion">Descripción:</label>
            <input type="text" id="txtDescripcion">
        </div>

        <button type="button" id="btnRegistrarCertificacion">Guardar certificación</button>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/certificacion-registrar.js"></script>

</body>
</html>
