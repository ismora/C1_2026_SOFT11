<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Agregar nueva certificacion</h1>
    <form>
        <div>
            <label for="txtNombre">Nombre:</label>
            <input type="text" id="txtNombre" required> 
        </div>

        <div>
            <label for="txtInstitucion">Institucion:</label>
            <input type="text" id="txtInstitucion" required>
        </div>

        <div>
            <label for="txtDescripcion">Descripcion</label>
            <input type="text" id="txtDescripcion" required>
        </div>

        <button type="button" id="btnRegistrarCertificacion">Guardar Certificacion</button>

    </form>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/certificacion-registrar.js"></script>
</body>
</html>
