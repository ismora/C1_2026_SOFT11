<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de usuario</title>
    <style>
        .input-error {
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <h1>Registro de usuario</h1>

    <form id="formderegistro">

        <fieldset>
            <legend><strong>Información personal</strong></legend>

            <div>
                <label for="txtNombre">Nombre:</label>
                <input type="text" id="txtNombre" />
            </div>

            <div>
                <label for="txtApellido">Apellido:</label>
                <input type="text" id="txtApellido" />
            </div>

            <div>
                <label for="txtUsuario">Nombre de usuario:</label>
                <input type="text" id="txtUsuario" />
            </div>
        </fieldset>

        <fieldset>
            <legend><strong>Seguridad</strong></legend>

            <div>
                <label for="txtPassword">Contraseña:</label>
                <input type="password" id="txtPassword" />
            </div>

            <div>
                <label for="txtConfirmar">Confirmar contraseña:</label>
                <input type="password" id="txtConfirmar" />
            </div>
        </fieldset>

        <fieldset>
            <legend><strong>Datos adicionales</strong></legend>

            <div>
                <label>Fecha de nacimiento:</label><br />
                <input type="number" id="txtMes" placeholder="Mes" min="1" max="12" />
                <input type="number" id="txtDia" placeholder="Día" min="1" max="31" />
                <input type="number" id="txtAnio" placeholder="Año" min="1900" max="2026" />
            </div>

            <div>
                <label for="slGenero">Género:</label>
                <select id="slGenero">
                    <option value="">Seleccione</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
        </fieldset>

        <button type="button" id="btnRegistrar">Registrar</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/registro.js"></script>
</body>

</html>
